[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo-humanoid"
version = "0.1.0"
description = "UFO: an unsupervised reinforcement learning framework for humanoid control"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "dm-control>=1.0.20",
    "easydict>=1.13",
    "gymnasium>=1.0.0",
    "h5py>=3.14.0",
    "huggingface-hub>=0.24.0",
    "joblib>=1.4.2",
    "loguru>=0.7.3",
    "mediapy>=1.2.3",
    "mjlab==1.6.0",
    "mujoco~=3.11.0",
    "omegaconf>=2.3.0",
    "onnx>=1.16.1",
    "pandas==2.3.1",
    "pot>=0.9.5",
    "pydantic>=2.11.3",
    "rich>=14.0.0",
    "safetensors>=0.5.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "wandb>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ufo = ["data/**/*"]

[tool.setuptools.packages.find]
include = ["ufo*"]

[dependency-groups]
dev = [
    "ruff==0.9.6",
    "pytest>=8.0",
]

[tool.uv]
override-dependencies = [
    "dm-control>=1.0.20",
    "wandb>=0.26.0",
    # PyTorch 2.7.1 pins 2.26.2, which fails on Blackwell multi-GPU setups.
    "nvidia-nccl-cu12==2.26.5",
]

[tool.ruff]
line-length = 140
extend-exclude = ["wandb"]

[tool.ruff.lint]
# E402: imports at the top of the files (but lazy import is useful to reduce memory use)
# E731: Do not assign lambdas (but these are handy for functional programming, and used in tests to change logic)
ignore = ["E402", "E731"]
# Add import sorting to the linting
extend-select = ["I"] # This is disabled as currently it causes different results on github and locally
