# Shared FB / TeCH motion task defaults. Robot metadata lives in configs/robots.
num_envs: 1
simulator:
  config:
    sim:
      fps: 200
      control_decimation: 4
domain_rand:
  push_robots: true
  push_interval_s:
  - 1
  - 3
  max_push_vel_xy: 0.5
  max_push_ang_vel: 0.5
  push_velocity_range: null
  randomize_base_com: true
  base_com_range:
    x:
    - -0.02
    - 0.02
    y:
    - -0.02
    - 0.02
    z:
    - -0.02
    - 0.02
  randomize_link_mass: true
  link_mass_bodies: null
  mass_scale_inertia: false
  link_mass_range:
  - 0.95
  - 1.05
  randomize_pd_gain: false
  kp_range:
  - 0.75
  - 1.25
  kd_range:
  - 0.75
  - 1.25
  randomize_friction: true
  friction_range:
  - 0.5
  - 1.25
  randomize_base_mass: false
  base_mass_range: [-2.0, 2.0]
  randomize_joint_parameters: false
  joint_friction_range: [0.8, 1.2]
  armature_range: [0.8, 1.2]
  randomize_torque_rfi: false
  rfi_lim: 0.1
  randomize_rfi_lim: false
  rfi_lim_range:
  - 0.5
  - 1.5
  randomize_ctrl_delay: false
  ctrl_delay_step_range:
  - 0
  - 1
  randomize_default_dof_pos: true
  default_dof_pos_startup_only: false
  default_dof_pos_noise_range:
  - -0.02
  - 0.02
rewards:
  set_reward: Zhengyi
  only_positive_rewards: false
  reward_scales:
    penalty_torques: -1.0e-06
    penalty_undesired_contact: -1
    penalty_action_rate: -0.5
    penalty_ankle_roll: -0.5
    penalty_feet_ori: -0.1
    feet_heading_alignment: -0.1
    penalty_slippage: -1.0
    limits_dof_pos: -10.0
    limits_dof_vel: -5.0
    limits_torque: -5.0
    height_gated_undesired_contacts: 0.0
    joint_acc_l2: 0.0
    joint_velocity_l2: 0.0
    joint_energy: 0.0
    joint_rated_velocity: 0.0
    joint_rated_effort: 0.0
    action_jerk_l2: 0.0
    angular_momentum_rate_l2: 0.0
    yaw_angular_momentum_l2: 0.0
  reward_penalty_curriculum: true
  reward_initial_penalty_scale: 0.1
  reward_min_penalty_scale: 0.0
  reward_max_penalty_scale: 1.0
  reward_penalty_level_down_threshold: 40
  reward_penalty_level_up_threshold: 42
  reward_penalty_degree: 1.0e-05
  num_compute_average_epl: 10000
  reward_limit:
    soft_dof_pos_limit: 0.95
    soft_dof_vel_limit: 0.95
    soft_torque_limit: 0.95
  reward_penalty_reward_names:
  - penalty_torques
  - penalty_action_rate
  - limits_dof_pos
  - limits_torque
  - penalty_slippage
  - penalty_undesired_contact
  - penalty_ankle_roll
  - penalty_feet_ori
obs:
  history_oldest_first: false
  use_obs_filter: true
  root_height_obs: true
  obs_auxiliary:
    history_actor:
      base_ang_vel: 4
      projected_gravity: 4
      dof_pos: 4
      dof_vel: 4
      actions: 4
  obs_scales:
    actions: 1.0
    dof_pos: 1.0
    dof_vel: 1.0
    max_local_self: 1.0
    base_lin_vel: 1.0
    base_ang_vel: 1.0
    projected_gravity: 1.0
    history_actor: 1.0
  noise_scales:
    base_lin_vel: 0.0
    base_ang_vel: 0.2
    projected_gravity: 0.05
    dof_pos: 0.01
    dof_vel: 0.5
    actions: 0.0
    max_local_self: 0.0
    history_actor: 0.0
  add_noise_curriculum: false
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 1.0e-05
  noise_curriculum_degree: 1.0e-05
  noise_curriculum_level_down_threshold: 40
  noise_curriculum_level_up_threshold: 42
env_spacing: 5.0
max_episode_length_s: 10
normalization:
  clip_observations: 100.0
termination:
  terminate_when_close_to_dof_pos_limit: false
  terminate_when_close_to_dof_vel_limit: false
  terminate_when_close_to_torque_limit: false
  terminate_by_contact: false
  terminate_by_gravity: false
  terminate_by_low_height: false
  terminate_when_motion_end: false
  terminate_when_motion_far: false
noise_to_initial_level: 0
init_noise_scale:
  dof_pos: 0.1
  dof_vel: 0.15
  root_pos: 0.05
  root_rot: 10
  root_vel: 0.01
  root_ang_vel: 0.01
enforce_randomize_motion_start_eval: false
lie_down_init: false
lie_down_init_prob: 0.0
